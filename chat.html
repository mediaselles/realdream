<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opening Chat...</title>
  <style>
    body {
      background: #0c0c0e;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(253, 95, 194, 0.2);
      border-top-color: #fd5fc2;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .title { font-size: 18px; font-weight: 600; }
    .sub { font-size: 14px; color: #a1a1aa; margin-top: 6px; }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <div class="title" id="title">Opening Chat...</div>
  <div class="sub" id="status-text">Connecting to ourdream.ai...</div>
  <p style="margin-top: 16px; font-size: 13px;"><a id="manual-link" href="#" style="color: #fd5fc2; text-decoration: underline;">Click here if not redirected automatically</a></p>

  <script>
    (function() {
      const params = new URLSearchParams(window.location.search);
      const model = params.get('model') || '';
      const gender = params.get('gender') || 'female';
      const action = params.get('action') || 'chat';

      let targetUrl = 'https://www.ourdreamersai13.com/496R32N/NFC9H/?uid=141&sub3=chat';
      if (action === 'create') {
        targetUrl = 'https://www.ourdreamersai13.com/496R32N/NFC9H/?uid=134&sub3=create';
      } else if (model) {
        targetUrl = `https://www.ourdreamersai13.com/496R32N/NFC9H/?uid=141&sub1=${encodeURIComponent(model)}&sub2=${encodeURIComponent(gender)}&sub3=chat&source_id=${encodeURIComponent(model)}`;
      }

      const manualLink = document.getElementById('manual-link');
      if (manualLink) manualLink.href = targetUrl;

      window.location.replace(targetUrl);
    })();
  </script>
</body>
</html>
